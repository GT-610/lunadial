name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android release
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDK components
        run: |
          set -euo pipefail
          # GitHub runners already ship an SDK; the setup-android action still
          # tries to install the removed "tools" package, so call sdkmanager
          # directly and only add what this project needs.
          if command -v sdkmanager >/dev/null 2>&1; then
            SM=sdkmanager
          else
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > lunadial-release.jks
          {
            printf 'storeFile=lunadial-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
          } > key.properties

      - name: Build APK and App Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Report artifact sizes
        run: |
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lunadial-android
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing files
        if: always()
        shell: bash
        run: rm -f key.properties lunadial-release.jks

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/app-release.apk
            release-assets/app-release.aab
          )

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
