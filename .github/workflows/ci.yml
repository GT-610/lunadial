name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Android app bundle
        if: matrix.target == 'android'
        run: flutter build appbundle --release
      - name: Build Linux application
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: Build Windows application
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Build macOS application
        if: matrix.target == 'macos'
        run: flutter build macos --release

  reproducibility:
    name: Reproducibility check
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Build split APKs twice from isolated source paths
        shell: bash
        run: |
          set -euo pipefail

          # This is a preflight check. F-Droid's final verification compares
          # the published developer-signed APK using signature copying.
          flutter config --no-analytics

          abis=(armeabi-v7a arm64-v8a x86_64)

          build_apks() {
            local build_name="$1"
            local source_path="$RUNNER_TEMP/lunadial-reproducibility-source"
            local build_status

            # Flutter AOT embeds absolute source paths. Recreate an isolated
            # worktree for each build at this canonical path so the sources
            # remain independent without introducing path-based differences.
            git -C "$GITHUB_WORKSPACE" worktree add --detach "$source_path" "$GITHUB_SHA"

            if (
              cd "$source_path"
              export GRADLE_USER_HOME="$RUNNER_TEMP/lunadial-gradle-$build_name"
              flutter clean
              flutter pub get --enforce-lockfile
              bash scripts/release/patch-jni-build-id.sh
              flutter build apk --release --split-per-abi
              for abi in "${abis[@]}"; do
                cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
                  "$RUNNER_TEMP/lunadial-reproducibility-$build_name-$abi.apk"
              done
            ); then
              build_status=0
            else
              build_status=$?
            fi

            git -C "$GITHUB_WORKSPACE" worktree remove --force "$source_path"
            return "$build_status"
          }

          build_apks one
          build_apks two

          different=0
          for abi in "${abis[@]}"; do
            first_apk="$RUNNER_TEMP/lunadial-reproducibility-one-$abi.apk"
            second_apk="$RUNNER_TEMP/lunadial-reproducibility-two-$abi.apk"

            if cmp --silent "$first_apk" "$second_apk"; then
              echo "Reproducible $abi APK: $(sha256sum "$first_apk" | cut -d ' ' -f 1)"
              continue
            fi

            different=1
            echo "$abi APK files differ. SHA-256 checksums:"
            sha256sum "$first_apk" "$second_apk"
            unzip -l "$first_apk" > "$RUNNER_TEMP/lunadial-reproducibility-one-$abi.list"
            unzip -l "$second_apk" > "$RUNNER_TEMP/lunadial-reproducibility-two-$abi.list"
            echo "$abi APK archive listings diff:"
            diff -u \
              "$RUNNER_TEMP/lunadial-reproducibility-one-$abi.list" \
              "$RUNNER_TEMP/lunadial-reproducibility-two-$abi.list" || true
          done

          exit "$different"
      - name: Upload reproducibility diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lunadial-reproducibility-diagnostics
          path: |
            ${{ runner.temp }}/lunadial-reproducibility-*.apk
            ${{ runner.temp }}/lunadial-reproducibility-*.list
          if-no-files-found: warn
          retention-days: 14
